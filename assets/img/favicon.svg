<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0F172A"/>
  <!-- Radio Broadcast Signal Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="24" opacity="0.35"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#grad)" stroke-width="28" opacity="0.75"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#grad)" stroke-width="32" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="36" fill="#F43F5E"/>
</svg>
